<!doctype html>
<!--
  A stand-in for the claude.ai sidebar, served at https://claude.ai/* by the
  tests (tests/e2e.mjs) and by the README screenshot script (docs/src/render.mjs).
  Not a copy of claude.ai: just enough structure (nav links, Pinned/Recents
  headings, chat links, client-side routing) for the extension to work on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: #262624; color: #c2c0b6;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  nav { width: 288px; flex: none; background: #1f1e1d; border-right: 1px solid #33322f;
    padding: 12px 8px; overflow: auto; display: flex; flex-direction: column; }
  nav > * { flex: none; }
  nav a { display: flex; align-items: center; gap: 10px; color: #e8e6e3; text-decoration: none;
    padding: 7px 10px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav a:hover { background: #2b2a27; }
  nav a.active { background: #33322f; }
  .ico { width: 16px; height: 16px; border: 1.5px solid #9a978f; border-radius: 4px; flex: none; }
  .h { color: #9a978f; font-size: 12px; padding: 14px 10px 4px; display: flex; justify-content: space-between; align-items: center; }
  .h button { background: none; border: 0; color: #9a978f; font-size: 16px; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; }
  main { flex: 1; padding: 28px 48px; overflow: hidden; }
  main h1 { font-size: 15px; font-weight: 500; color: #e8e6e3; margin: 0 0 28px; }
  .msg { max-width: 640px; }
  .user { margin-left: auto; width: 60%; background: #1a1918; border-radius: 12px; padding: 12px 16px; color: #e8e6e3; margin-bottom: 24px; }
  .line { height: 10px; border-radius: 5px; background: #3a3936; margin: 10px 0; }
</style>
</head>
<body>
<nav>
  <a href="/code"><span class="ico"></span>New</a>
  <a href="/code/projects"><span class="ico"></span>Projects</a>
  <a href="/code/artifacts"><span class="ico"></span>Artifacts</a>
  <a href="/code/scheduled"><span class="ico"></span>Scheduled</a>
  <div>
    <div class="h"><span>Pinned</span></div>
    <ul id="pinned"></ul>
  </div>
  <div>
    <div class="h"><span>Recents</span><button aria-label="New">+</button></div>
    <ul id="recents"></ul>
  </div>
</nav>
<main>
  <h1 id="title">New session</h1>
  <div class="msg">
    <div class="user">Can you help me plan this?</div>
    <div class="line" style="width:92%"></div><div class="line" style="width:84%"></div>
    <div class="line" style="width:88%"></div><div class="line" style="width:52%"></div>
  </div>
</main>
<script>
  const SPACE = location.pathname.startsWith('/code') ? 'code' : 'chat';
  const pathFor = (id) => SPACE === 'code' ? '/code/session_' + id : '/chat/3f2a9c1e-0000-4000-8000-' + id.padStart(12, '0');
  const PINNED = [['p1', 'Team onboarding guide']];
  const RECENTS = [
    ['s1', 'Refactor auth middleware'], ['s2', 'Fix flaky CI tests'], ['s3', 'Landing page redesign'],
    ['s4', 'Postgres migration plan'], ['s5', 'Weekly report script'], ['s6', 'Rust CLI argument parser'],
    ['s7', 'Docs site search'], ['s8', 'Interview prep notes'],
  ];
  function link(id, title) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = pathFor(id);
    a.textContent = title;
    li.append(a);
    return li;
  }
  PINNED.forEach(([id, t]) => document.getElementById('pinned').append(link(id, t)));
  RECENTS.forEach(([id, t]) => document.getElementById('recents').append(link(id, t)));
  if (SPACE === 'chat') {
    document.querySelector('nav > a').href = '/new';
    document.querySelector('.h span').textContent = 'Starred';
  }
  function syncActive() {
    for (const a of document.querySelectorAll('nav a')) a.classList.toggle('active', a.getAttribute('href') === location.pathname);
    const cur = [...PINNED, ...RECENTS].find(([id]) => pathFor(id) === location.pathname);
    document.getElementById('title').textContent = cur ? cur[1] : 'New session';
    document.title = (cur ? cur[1] + ' - ' : '') + 'Claude';
  }
  // Client-side routing, like the real app.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('nav a');
    if (!a) return;
    e.preventDefault();
    history.pushState({}, '', a.getAttribute('href'));
    syncActive();
  });
  // Tests: simulate starting a new chat from the "New" page.
  window.createChat = (id, title) => {
    RECENTS.unshift([id, title]);
    history.pushState({}, '', pathFor(id));
    syncActive();
    setTimeout(() => document.getElementById('recents').prepend(link(id, title)), 300);
  };
  syncActive();
</script>
</body>
</html>
