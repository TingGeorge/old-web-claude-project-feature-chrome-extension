<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body { width: 1280px; height: 420px; font-family: Inter, -apple-system, sans-serif; overflow: hidden; position: relative; color: #fff;
    background: radial-gradient(900px 480px at 88% 115%, #f2a27f66, transparent 60%),
                linear-gradient(135deg, #2a1a14 0%, #7a3a24 50%, #d27352 100%); }
  .stack { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); width: 300px; }
  .row { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; margin: 8px 0; border-radius: 12px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); font-size: 18px; font-weight: 500; color: #fff3ec; }
  .row.sub { margin-left: 34px; background: rgba(255,255,255,.07); }
  .row svg { flex: none; }
  .wrap { position: absolute; left: 92px; top: 50%; transform: translateY(-50%); display: flex; gap: 40px; align-items: center; }
  img { width: 164px; height: 164px; filter: drop-shadow(0 18px 40px rgba(0,0,0,.35)); }
  h1 { font-size: 66px; font-weight: 800; margin: 0; letter-spacing: -2px; }
  p { font-size: 25px; margin: 10px 0 26px; color: #ffe1d3; font-weight: 500; }
  .chips { display: flex; gap: 12px; }
  .chip { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); font-size: 17px; font-weight: 600; }
</style></head><body>
  <div class="stack">

    <div class="row sub"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffd9c7" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Backend</div>
    <div class="row"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9fdcaa" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Side projects</div>
    <div class="row"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9bdf5" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Learning</div>
  </div>
  <div class="wrap">
    <img src="icon/icon.svg" alt="">
    <div>
      <h1>Claude Folders</h1>
      <p>Organize your Claude chats into folders,<br>like the old Projects.</p>
