name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: for f in extension/*.js extension/src/*.js extension/popup/*.js; do node --check "$f"; done

      - name: Manifest references existing files
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            const files = [
              m.background.service_worker, m.action.default_popup, m.options_ui.page,
              ...m.content_scripts.flatMap((c) => c.js),
              ...Object.values(m.icons), ...Object.values(m.action.default_icon),
            ];
            for (const f of files) if (!fs.existsSync("extension/" + f)) throw new Error("missing " + f);
            if (!m.key) throw new Error("manifest key missing (keeps the extension ID stable)");
            console.log("manifest ok:", m.name, m.version);
          '

      - name: Unit tests
        run: node tests/test_store.mjs

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Package release
        run: scripts/package.sh

      - name: Check release packages
        run: |
          unzip -p dist/claude-folders-webstore-v*.zip manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert "key" not in m; print("ok", m["version"])'
          listing="$(unzip -l dist/claude-folders-v*.zip)"
          for f in manifest.json src/content.js popup/popup.html icons/icon128.png LICENSE docs/images/banner.jpg; do
            grep -q "claude-folders/$f" <<< "$listing" || { echo "missing $f" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*.zip
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end tests (real extension in Chromium)
        run: node tests/e2e.mjs
